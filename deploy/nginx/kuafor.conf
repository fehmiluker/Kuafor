# /etc/nginx/sites-available/kuafor.conf
server {
    listen 80;
    server_name randevu.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name randevu.example.com;
    root /var/www/kuafor/current/public;   # document root = public/ only
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/randevu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/randevu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;
    charset utf-8;
    server_tokens off;

    # Never serve dotfiles (.env, .git ...)
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Uploaded images only; never execute anything under storage
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }
}
