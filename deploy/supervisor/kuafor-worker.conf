; /etc/supervisor/conf.d/kuafor-worker.conf
[program:kuafor-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kuafor/current/artisan queue:work redis --queue=webhooks,notifications,default --sleep=1 --tries=5 --backoff=10 --max-time=3600 --memory=256
directory=/var/www/kuafor/current
user=www-data
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/kuafor/worker.log
