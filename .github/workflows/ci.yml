name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kuafor_test
          MYSQL_USER: kuafor
          MYSQL_PASSWORD: kuafor
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, gd, pcntl, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci && npm run build
      # public/build is committed (hosting needs no Node.js); it must match the sources.
      # On design/** pushes and PRs a stale build is only a warning: build-assets.yml
      # commits the rebuild and re-runs this workflow (workflow_dispatch), which is strict.
      - name: Committed frontend build is up to date
        env:
          AUTO_BUILD: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.head_ref || github.ref_name, 'design/') }}
        run: |
          if [ -n "$(git status --porcelain -- public/build)" ]; then
            git status --short -- public/build
            if [ "$AUTO_BUILD" = "true" ]; then
              echo "::warning::public/build guncel degil; 'Build frontend assets' is akisi derleyip commit edecek."
            else
              echo "public/build guncel degil - 'npm run build' calistirip commit edin."
              exit 1
            fi
          fi
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: kuafor
          DB_PASSWORD: kuafor
